#tpq .pillars{display:flex;gap:8px;margin-bottom:20px;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;}
#tpq .pillars::-webkit-scrollbar{display:none;}

#tpq .grid{display:flex;gap:24px;align-items:flex-start;}
#tpq .left{flex:1 1 420px;min-width:0;}
#tpq .right{flex:0 0 300px;box-sizing:border-box;}

#tpq input#emailIn::placeholder{color:#54607a;}
#tpq .optrow{cursor:pointer;display:flex;align-items:center;gap:12px;padding:14px 15px;border-radius:10px;margin-bottom:8px;transition:all .15s ease;}
#tpq .optrow:hover{border-color:var(--acc) !important;}
#tpq .navBtn{flex:1 1 0;text-align:center;}
@media (max-width:740px){
  #tpq .wrap{padding:22px 18px 22px !important;}
  #tpq .grid{flex-direction:column !important;gap:16px !important;}
  #tpq .left{flex-basis:auto !important;width:100%;}
  #tpq .right{flex-basis:auto !important;width:100%;}
  #tpq .pillars{margin:0 -18px 14px;padding:0 18px 4px;}

<script>
var DATA = {"PILLARS": {"vstup": {"label": "Pulz a objem", "icon": "ti-heartbeat"}, "tech": {"label": "Technika behu", "icon": "ti-run"}, "tren": {"label": "Tréning", "icon": "ti-chart-line"}, "telo": {"label": "Pripravenosť tela", "icon": "ti-first-aid-kit"}, "poroz": {"label": "Porozumenie behu", "icon": "ti-brain"}}, "ORDER": ["vstup", "tech", "tren", "telo", "poroz"], "EXPERTS": {"stefan": {"i": "ŠO", "n": "Štefan Oravec", "r": "Zakladateľ · reprezentant SR"}, "kristian": {"i": "KS", "n": "Kristián Simonides", "r": "Kondičný tréner IV. st."}, "dusan": {"i": "DL", "n": "Dušan Lihan", "r": "Špecialista na prevenciu zranení"}}, "PILLAR_EXPERT": {"vstup": "kristian", "tech": "stefan", "tren": "kristian", "telo": "dusan", "poroz": "stefan"}, "Q": [{"p": "vstup", "type": "branch", "root": {"q": "Trénuješ podľa <span>pulzu</span>, alebo skôr podľa <span>tempa</span>?", "opts": ["Sledujem pulz / pulzové pásma", "Pulz nesledujem, riadim sa tempom alebo pocitom"], "note": "Pulz ti povie, či telo naozaj rozvíja to, čo si myslíš – tempo samo o sebe to neukáže."}, "branches": {"0": [{"q": "Koľko % svojich behov stráviš v pásme <span>60–75 % max. pulzu</span> (Z1–Z2)?", "opts": ["Menej ako 20 %", "Okolo 40–50 %", "Okolo 60–70 %", "Viac ako 80 %"], "scores": [20, 45, 70, 100], "ref": "odporúčaný podiel: aspoň 80 % objemu", "note": "Toto číslo ukáže, či buduješ aeróbny základ, alebo telo preťažuješ skôr, než je pripravené."}, {"q": "A koľko % behov stráviš <span>nad ANP</span> (nad ~85 %, Z4–Z5)?", "opts": ["Viac ako 30 %", "Okolo 15–30 %", "Okolo 5–15 %", "Menej ako 5 %"], "scores": [15, 40, 65, 90], "ref": "odporúčaný podiel: 1–3 % objemu", "note": "Priveľa času nad prahom = chronická únava bez zotavenia. Primálo = chýba podnet na rozvoj rýchlosti."}], "1": [{"q": "V akom tempe zvyčajne <span>behávaš?</span>", "opts": ["Rýchlejšie ako 4:30 min/km", "4:30–5:30 min/km", "5:30–6:30 min/km", "Pomalšie ako 6:30 min/km"], "note": "Toto nám pomôže presnejšie prepočítať tvoje pásma v mailovom reporte."}, {"q": "Aké <span>rozdiely v tempe</span> zvyčajne mávaš medzi behmi?", "opts": ["Takmer žiadne, behám vždy rovnako", "Mierne, podľa nálady", "Výrazné, podľa terénu", "Výrazné, mením ho zámerne"], "note": "Rozdiely v tempe naznačujú, či vôbec striedaš intenzity, alebo trénuješ stále na jednom mieste."}, {"q": "Je rozdiel spôsobený len terénom, alebo tempo aj <span>zámerne/systematicky</span> meníš?", "opts": ["Len terénom alebo náhodou", "Čiastočne aj zámerne", "Áno, systematicky podľa cieľa"], "scores": [25, 55, 90], "note": "Náhodná zmena tempa nerozvíja nič konkrétne – zámerná zmena je základ tréningových zón."}, {"q": "Vieš, čo sa rozvíja pri <span>nízkom pulze</span> a prečo ísť aj <span>nad ANP?</span>", "opts": ["Nie, netuším", "Trochu tuším, ale neviem to vysvetliť", "Áno, viem to presne vysvetliť"], "scores": [20, 55, 90], "note": "Toto nie je skúška – ukáže, koľko z fyziológie tréningu už poznáš."}]}}, {"p": "vstup", "q": "Ako si rozdeľuješ svoj <span>týždenný objem</span> behov podľa intenzity?", "opts": ["Takmer všetko naľahko", "Približne 80 % ľahko, 20 % rýchlo / namáhavo", "Pol na pol", "Väčšinou rýchlo alebo namáhavo"], "scores": [80, 100, 45, 15], "ref": "odporúčaný pomer: 80/20", "note": "Pomer ľahkých a náročných behov rozhoduje o tom, či telo stíha rásť medzi tréningami."}, {"p": "tech", "q": "Ako by si opísal <span>došľap</span> pri bežnom tréningu?", "opts": ["Päta výrazne pred telom", "Stredná časť chodidla, noha pod bokmi", "Predná časť chodidla, vysoká kadencia", "Neviem – nikto mi to neanalyzoval"], "scores": [25, 95, 75, 40], "note": "Miesto dopadu chodidla voči ťažisku rozhoduje o tom, či ťa každý krok posúva dopredu, alebo brzdí."}, {"p": "tech", "q": "Natočil si sa niekedy pri behu a <span>vyhodnotil</span> polohu tela?", "opts": ["Nikdy", "Natočil som sa, ale nevyhodnotené", "Natočil som sa, sám som si niečo všimol", "Natočil som sa, odborne rozobraté"], "scores": [15, 40, 65, 100], "note": "Vlastné vnímanie techniky sa od reality často výrazne líši – video ukáže, čo telo naozaj robí."}, {"p": "tech", "q": "Analyzoval ti niekedy odborník <span>techniku behu?</span>", "opts": ["Nikdy, behám bez spätnej väzby", "Raz, bez videa alebo konkrétnych odporúčaní", "Áno, videoanalýza s konkrétnymi odporúčaniami", "Pravidelne, mám techniku pod kontrolou"], "scores": [15, 40, 75, 100], "note": "Jednorazový pohľad ukáže stav v moment analýzy – technika sa ale mení s únavou aj objemom."}, {"p": "tren", "q": "Ako nastavuješ <span>intenzitu</span> tréningu?", "opts": ["Podľa pocitu, bez merania", "Podľa tempa na km", "Podľa srdcovej frekvencie a zón", "Mám periodizovaný plán s cieľmi"], "scores": [20, 45, 75, 100], "note": "Bez merateľného vodidla sa dá udržať forma, ale ťažko sa dá systematicky zlepšovať."}, {"p": "tren", "q": "Koľko percent tvojich behov je <span>naozaj ľahkých?</span>", "opts": ["Menej ako 20 %", "Okolo 50 %", "Viac ako 70 %", "Nerozlišujem intenzity"], "scores": [25, 55, 95, 15], "ref": "odporúčaný pomer: 80/20", "note": "Odporúčaný pomer je zhruba 80 % ľahko, 20 % namáhavo – väčšina bežcov to má presne obrátene."}, {"p": "tren", "q": "Pozrel si sa niekedy <span>spätne</span> na svoj tréning a zmenil si podľa toho niečo?", "opts": ["Nikdy som sa nepozrel spätne", "Pozrel, ale nič som nezmenil", "Občas skontrolujem a mierne upravím", "Pravidelne analyzujem a systematicky upravujem"], "scores": [15, 40, 70, 100], "ref": "85 % bežcov v dátach stagnuje – najčastejšie preto, že opakujú rovnaký podnet", "note": "85 % bežcov v dátach stagnuje – najčastejšie preto, že mesiac čo mesiac opakujú rovnaký podnet."}, {"p": "telo", "q": "Ako často zaraďuješ <span>silový tréning</span> bežca?", "opts": ["Nikdy", "Príležitostne, bez systému", "1× týždenne, cielene", "2× a viac, s programom"], "scores": [15, 45, 80, 100], "note": "Bez posilňovania chýba šľachám a kĺbom spevnenie presne tam, kde ho beh najviac zaťažuje."}, {"p": "telo", "q": "Ako reaguje tvoje telo <span>po náročnom behu?</span>", "opts": ["Dlhodobá únava, bolesti kĺbov", "Svalová únava, ale bez bolestí", "Rýchla regenerácia do 24 hodín", "Výborne, regenerujem bez problémov"], "scores": [15, 55, 85, 100], "note": "Rýchlosť a kvalita regenerácie ukazujú, či trénuješ v súlade s tým, čo telo aktuálne zvláda."}, {"p": "telo", "type": "condbranch", "q": "Ako často ťa obmedzí <span>bolesť alebo zranenie?</span>", "opts": ["Často – niekoľkokrát za mesiac", "Občas – niekoľkokrát za rok", "Zriedka – raz za rok alebo menej", "Takmer nikdy"], "scores": [15, 45, 75, 100], "flag": true, "note": "Opakujúca sa bolesť má takmer vždy jednu koreňovú príčinu – nie je to náhoda.", "sub": {"q": "Kde ťa bolesť <span>najčastejšie</span> obmedzuje?", "opts": ["Koleno", "Achilovka / lýtko", "Bedro / panva", "Chodidlo / členok", "Chrbát"], "note": "Táto informácia nám pomôže presnejšie zacieliť odporúčania v mailovom reporte."}}, {"p": "poroz", "type": "selfcheck", "q": "Čo je hlavná príčina <span>tvojej stagnácie?</span>", "opts": ["Technika – neviem správne behať", "Tréning – nemám systém", "Telo – chýba mi sila a stabilita", "Neviem – preto som tu"], "note": "Táto otázka porovná tvoj odhad s tým, čo naozaj ukázali tvoje predchádzajúce odpovede."}], "PILLAR_ACTIONS": {"vstup": ["Zaveď tréningové zóny podľa maximálneho pulzu", "Drž pravidlo 80/20 – 80 % objemu skutočne naľahko", "Zaraď pravidelne úsek nad ANP, nie len náhodne"], "tech": ["Nechaj si analyzovať techniku videorozborom u trénera", "Cieľ pri došľape: noha pod bokmi, nie pred telom", "Zapracuj na kadencii – cieľ okolo 170–180 krokov/min"], "tren": ["Nastav si periodizovaný plán namiesto tréningu podľa pocitu", "Drž si aspoň 80 % behov skutočne ľahkých", "Raz za pár týždňov sa pozri spätne, čo si trénoval, a uprav podnet"], "telo": ["Zaraď 2× týždenne silový tréning zameraný na bežca", "Sleduj signály tela – bolesť je varovanie, nie výzva na pokračovanie", "Daj regenerácii toľko priestoru, koľko dávaš tréningu"]}, "TEASER_TEXTS": {"vstup": "Tvoje tréningy pravdepodobne nerozvíjajú presne to, čo si myslíš – celý rozbor prečo nájdeš v maile.", "tech": "Tvoja technika má rezervu, ktorá ťa dlhodobo stojí energiu aj rýchlosť – detaily posielame mailom.", "tren": "Spôsob, akým si nastavuješ tréning, ťa pravdepodobne brzdí viac, než tušíš – rozbor je v maile.", "telo": "Tvoje telo pravdepodobne nie je pripravené na záťaž, ktorú mu dávaš – prečo, sa dozvieš v maile."}};
var PIXEL_ID = '1077151229776455';
var PILLARS = DATA.PILLARS, ORDER = DATA.ORDER, EXPERTS = DATA.EXPERTS, PILLAR_EXPERT = DATA.PILLAR_EXPERT;
var Q = DATA.Q;
var ACC = '#00C8BE', GREEN = '#34D399';

var pillarsEl = document.getElementById('pillars');
var contentEl = document.getElementById('content');

var i = 0;               // main question index 0..11
var subStep = 0;          // 0 = root/main step; >0 = follow-up step within current item
var picked = {};          // key i+'_'+subStep -> selected option index
var pulseChoice = null;   // 'pulz'|'tempo' branch chosen at Q0
var pillarScores = [0,0,0,0,0], pillarMax = [0,0,0,0,0];
var weakestIdx = null;

function pillarKeyToIdx(k){ return ORDER.indexOf(k); }

function itemAt(idx){ return Q[idx]; }

/* returns list of step-defs for the CURRENT item (index i), given picks made so far */
function stepsForItem(idx){
  var item = Q[idx];
  if(item.type === 'branch'){
    var steps = [item.root];
    var rc = picked[idx+'_0'];
    if(rc !== undefined){
      var key = rc === 0 ? '0' : '1';
      steps = steps.concat(item.branches[key]);
    }
    return steps;
  }
  if(item.type === 'condbranch'){
    var steps = [item];
    var rootIdx = picked[idx+'_0'];
    if(rootIdx === 0 || rootIdx === 1){ steps.push(item.sub); }
    return steps;
  }
  return [item];
}

function currentStepDef(){
  var steps = stepsForItem(i);
  return steps[subStep] || steps[steps.length-1];
}

function pillarStatus(k){
  var idx = pillarKeyToIdx(k);
  var qIdxs = []; Q.forEach(function(q,qi){ if(q.p===k) qIdxs.push(qi); });
  var minI = Math.min.apply(null, qIdxs), maxI = Math.max.apply(null, qIdxs);
  if(i > maxI) return 'done';
  if(i >= minI && i <= maxI) return 'current';
  return 'pending';
}

function renderPillars(){
  pillarsEl.innerHTML = '';
  ORDER.forEach(function(k){
    var p = PILLARS[k];
    var st = pillarStatus(k);
    var color = st==='pending' ? '#5c6885' : (st==='current' ? ACC : GREEN);
    var border = st==='pending' ? '#1c2739' : (st==='current' ? ACC : GREEN);
    var bg = st==='pending' ? '#0c1320' : (st==='current' ? ACC+'14' : GREEN+'12');
    var d = document.createElement('div');
    d.style.cssText = 'display:flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;border:1px solid '+border+';background:'+bg+';color:'+color+';font-size:11px;white-space:nowrap;';
    var iconMarkup = st==='done' ? '<i class="ti ti-check" style="font-size:12px;"></i>' : '<i class="ti '+p.icon+'" style="font-size:12px;"></i>';
    d.innerHTML = iconMarkup + '<span>' + p.label + '</span>';
    pillarsEl.appendChild(d);
  });
}

function optRow(text, idx, key, selectedIdx){
  var sel = selectedIdx === idx;
  return '<div data-key="'+key+'" data-idx="'+idx+'" class="optrow" style="border:1px solid '+(sel?ACC:'#1c2739')+';background:'+(sel?ACC+'14':'#0c1320')+';">'+
    '<div style="width:17px;height:17px;min-width:17px;border-radius:50%;border:1.5px solid '+(sel?ACC:'#3a4863')+';display:flex;align-items:center;justify-content:center;">'+(sel?'<div style="width:8px;height:8px;border-radius:50%;background:'+ACC+';"></div>':'')+'</div>'+
    '<div style="color:'+(sel?'#fff':'#9aa5bd')+';font-size:13.5px;line-height:1.4;">'+text+'</div>'+
  '</div>';
}

function renderQuestion(){
  var item = Q[i];
  var pill = PILLARS[item.p];
  var steps = stepsForItem(i);
  var sd = steps[subStep];
  var key = i + '_' + subStep;
  var ex = EXPERTS[PILLAR_EXPERT[item.p]];

  var optsHtml = sd.opts.map(function(o, idx){ return optRow(o, idx, key, picked[key]); }).join('');
  var refHtml = sd.ref ? '<div style="display:inline-block;font-family:var(--font-mono);font-size:10.5px;color:'+ACC+';background:'+ACC+'12;border:1px solid '+ACC+'30;border-radius:6px;padding:5px 10px;margin-bottom:16px;line-height:1.5;">'+sd.ref+'</div>' : '';
  var flagHtml = (sd.flag) ? '<div style="font-size:11px;color:#FFD600;margin-top:9px;"><i class="ti ti-git-branch" style="font-size:12px;margin-right:4px;"></i>pri rizikovej odpovedi sa doopýta presné miesto bolesti</div>' : '';
  var stepBadge = (steps.length > 1) ? '<span style="color:#5c6885;font-weight:400;text-transform:none;letter-spacing:0;"> · krok '+(subStep+1)+' / '+steps.length+'</span>' : '';
  var noteHtml = '<div style="display:flex;gap:11px;margin-top:20px;padding-top:16px;border-top:1px solid #131b29;">'+
      '<div style="width:28px;height:28px;min-width:28px;border-radius:50%;background:'+ACC+'1c;display:flex;align-items:center;justify-content:center;font-size:10.5px;color:'+ACC+';font-weight:600;">'+ex.i+'</div>'+
      '<div><div style="color:#c7cede;font-size:11.5px;font-weight:500;">'+ex.n+' <span style="color:#5c6885;font-weight:400;">· '+ex.r+'</span></div>'+
      '<div style="color:#8a96ac;font-size:12px;line-height:1.5;margin-top:3px;">'+sd.note+'</div></div>'+
    '</div>';

  var gaugePct = Math.round(((i+1)/Q.length)*100);
  var CIRC = 2*Math.PI*50;
  var sideHtml = '<div class="right" style="background:#0d1524;border:1px solid #1c2739;border-radius:12px;padding:20px 18px;">'+
    '<div style="color:#8a96ac;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin-bottom:16px;">Priebežná analýza</div>'+
    '<div style="display:flex;justify-content:center;margin-bottom:18px;">'+
      '<svg width="112" height="112" viewBox="0 0 120 120" style="transform:rotate(-90deg);">'+
        '<circle cx="60" cy="60" r="50" fill="none" stroke="#141c2b" stroke-width="9"></circle>'+
        '<circle cx="60" cy="60" r="50" fill="none" stroke="'+ACC+'" stroke-width="9" stroke-linecap="round" stroke-dasharray="'+CIRC+'" stroke-dashoffset="'+(CIRC*(1-gaugePct/100))+'"></circle>'+
      '</svg></div>'+
    '<div style="text-align:center;margin-top:-96px;margin-bottom:70px;"><div style="color:#fff;font-size:24px;font-weight:700;">'+gaugePct+'%</div><div style="color:#5c6885;font-size:10px;margin-top:2px;">profilu hotový</div></div>'+
    '<div style="display:flex;flex-direction:column;gap:11px;">'+
      ORDER.map(function(k){
        var p = PILLARS[k]; var st = pillarStatus(k);
        var mark = st==='done' ? '<i class="ti ti-check" style="color:'+GREEN+';font-size:13px;"></i>' : (st==='current' ? '<span style="width:9px;height:9px;border-radius:50%;border:2px solid '+ACC+';display:block;"></span>' : '<span style="color:#3a4863;font-size:12px;">–</span>');
        var lblColor = st==='done' ? '#9aa5bd' : (st==='current' ? '#fff' : '#5c6885');
        var icColor = st==='done' ? '#5c6885' : (st==='current' ? ACC : '#3a4863');
        return '<div style="display:flex;align-items:center;gap:9px;"><span style="width:16px;height:16px;display:flex;align-items:center;justify-content:center;">'+mark+'</span><i class="ti '+p.icon+'" style="font-size:12px;color:'+icColor+';"></i><span style="font-size:11.5px;color:'+lblColor+';">'+p.label+'</span></div>';
      }).join('') +
    '</div></div>';

  contentEl.innerHTML =
    '<div class="grid">'+
      '<div class="left">'+
        '<div style="color:'+ACC+';font-size:10.5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;margin-bottom:9px;">'+pill.label+stepBadge+'</div>'+
        '<div class="qTitle" style="color:#fff;font-size:20px;font-weight:600;margin-bottom:18px;line-height:1.38;">'+sd.q+'</div>'+
        refHtml+'<div>'+optsHtml+'</div>'+flagHtml+noteHtml+
      '</div>'+
      sideHtml+
    '</div>';

  contentEl.querySelectorAll('.optrow').forEach(function(el){
    el.addEventListener('click', function(){
      var k = el.dataset.key, idx = parseInt(el.dataset.idx, 10);
      picked[k] = idx;
      renderQuestion();
      updateNav();
    });
  });

  renderPillars();
  var pct = Math.round(((i+1)/Q.length)*100);
  document.getElementById('bar').style.width = pct+'%';
  document.getElementById('progressLabel').textContent = 'Otázka '+(i+1)+' / '+Q.length;
}

function updateNav(){
  var steps = stepsForItem(i);
  var key = i+'_'+subStep;
  var ready = picked[key] !== undefined;
  var nextBtn = document.getElementById('next');
  nextBtn.style.opacity = ready ? '1' : '.35';
  nextBtn.style.pointerEvents = ready ? 'auto' : 'none';
  document.getElementById('prev').style.visibility = (i===0 && subStep===0) ? 'hidden' : 'visible';
  var atVeryEnd = (i === Q.length-1) && (subStep === steps.length-1);
  nextBtn.textContent = atVeryEnd ? 'Zobraziť výsledky →' : 'Ďalej →';
}

function scorePillar(pillarKey, pts){
  var idx = pillarKeyToIdx(pillarKey);
  pillarScores[idx] += pts; pillarMax[idx] += 100;
}

function finalizeItem(idx){
  var item = Q[idx];
  if(item.type === 'branch'){
    var rc = picked[idx+'_0'];
    var base = rc === 0 ? 60 : 30;
    var branchKey = rc === 0 ? '0' : '1';
    var arr = item.branches[branchKey];
    var scored = [];
    arr.forEach(function(s, si){
      if(s.scores){ var v = picked[idx+'_'+(si+1)]; if(v!==undefined) scored.push(s.scores[v]); }
    });
    var total = ([base].concat(scored)).reduce(function(a,b){return a+b;},0) / (1+scored.length);
    scorePillar(item.p, total);
    return;
  }
  if(item.type === 'condbranch'){
    var rootIdx = picked[idx+'_0'];
    scorePillar(item.p, item.scores[rootIdx]);
    return;
  }
  if(item.type === 'selfcheck'){
    var mapping = [0,1,2,null]; // opt idx -> pillar idx guessed (tech=1,tren=2,telo=3,neviem=null) -- adjust below
    var idxMap = {0:1, 1:2, 2:3, 3:null};
    var chosen = picked[idx+'_0'];
    var guessed = idxMap[chosen];
    var correct = computeWeakestPillar();
    var pts;
    if(chosen === 3) pts = 30;
    else if(guessed === correct) pts = 100;
    else pts = 40;
    scorePillar(item.p, pts);
    weakestIdx = correct;
    return;
  }
  scorePillar(item.p, item.scores[picked[idx+'_0']]);
}

function computeWeakestPillar(){
  var priority = [0,3,2,1]; // vstup > telo > tren > tech (poroz excluded, self-check pillar not part of ranking)
  var pcts = [0,1,2,3].map(function(k){ return pillarMax[k] ? (pillarScores[k]/pillarMax[k])*100 : 0; });
  var min = Math.min.apply(null, pcts);
  for(var p=0;p<priority.length;p++){ if(pcts[priority[p]]===min) return priority[p]; }
  return 0;
}

function goNext(){
  var steps = stepsForItem(i);
  var key = i+'_'+subStep;
  if(picked[key] === undefined) return;
  if(subStep < steps.length-1){
    subStep++;
    renderQuestion(); updateNav(); window.scrollTo(0,0);
    return;
  }
  finalizeItem(i);
  if(i === 6 && typeof fbq !== 'undefined') fbq('trackCustom', 'QuizProgress');
  if(i === Q.length-1){ finishQuiz(); return; }
  i++; subStep = 0;
  renderQuestion(); updateNav(); window.scrollTo(0,0);
}

function goPrev(){
  if(subStep > 0){ subStep--; renderQuestion(); updateNav(); return; }
  if(i > 0){ i--; subStep = stepsForItem(i).length-1; renderQuestion(); updateNav(); }
}

function finishQuiz(){
  var pcts = [0,1,2,3,4].map(function(k){ return pillarMax[k] ? Math.round((pillarScores[k]/pillarMax[k])*100) : 0; });
  var total = Math.round((pcts[0]+pcts[1]+pcts[2]+pcts[3])/4);
  var weakest = weakestIdx !== null ? weakestIdx : computeWeakestPillar();
  var strongest = [0,1,2,3].reduce(function(best,k){ return pcts[k] > pcts[best] ? k : best; }, 0);
  sessionStorage.setItem('tpd_results', JSON.stringify({
    pcts: pcts, total: total, weakest: weakest, strongest: strongest
  }));
  window.location.href = 'https://stefanoravec2.github.io/diagnostika-zobrazit-vysledky/';
}

document.getElementById('next').onclick = goNext;
document.getElementById('prev').onclick = goPrev;

if(typeof fbq !== 'undefined') fbq('trackCustom', 'QuizStarted');
renderQuestion();
updateNav();
</script>
</body>
